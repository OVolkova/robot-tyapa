[project]
name = "robot-tyapa"
version = "0.1.0"
description = "Raspberry Pi 5 orchestrator for the robot dog"
requires-python = ">=3.14"
dependencies = [
    "pyaudio>=0.2.14",
    "pyserial>=3.5",
    "numpy>=1.24.0",
    "torch>=2.12.0",
    "torchaudio>=2.7.0",
    "torchcodec>=0.14.0",
    "transformers>=4.51.3",
    "kokoro>=0.9.4",
    "en_core_web_sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
    "openai>=1.0.0",
    "soundfile>=0.13.1",
    "scipy>=1.15.2",
]

[project.optional-dependencies]
dev = ["ruff>=0.11.7", "pytest>=8.3.5", "pytest-cov>=6.0.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.coverage.run]
source = ["robot_tyapa"]
omit = [
    "robot_tyapa/main.py",
    # hardware-only path; tested manually on Pi
    "robot_tyapa/audio/playback.py",
]

[tool.coverage.report]
show_missing = true
fail_under = 90

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/integration"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
