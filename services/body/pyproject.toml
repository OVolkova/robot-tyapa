[project]
name = "tyapa-body"
version = "0.1.0"
description = "Body service: the only process that talks to the Petoi ESP32"
requires-python = ">=3.11"
dependencies = [
    "tyapa-protocol",
    "pyserial==3.5",
]

[project.optional-dependencies]
dev = ["pytest>=8.3.5", "pytest-cov>=6.0.0", "ruff>=0.11.7"]

[tool.uv.sources]
tyapa-protocol = { path = "../../protocol", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tyapa_body"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov --cov-report=term-missing"

[tool.coverage.run]
source = ["tyapa_body"]

[tool.coverage.report]
show_missing = true
fail_under = 80

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
