[project]
name = "tyapa-body"
version = "0.1.0"
description = "Body service: the only process that talks to the Petoi ESP32"
requires-python = ">=3.11"
dependencies = [
    "tyapa-protocol",
    "pyserial==3.5",
]

[project.optional-dependencies]
dev = ["pytest>=8.3.5", "ruff>=0.11.7"]

[tool.uv.sources]
tyapa-protocol = { path = "../../protocol", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tyapa_body"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
