[project]
name = "tyapa-hearing"
version = "0.1.0"
description = "Hearing service: mic, VAD, and Whisper STT"
requires-python = ">=3.11"
dependencies = [
    "tyapa-protocol",
    "pyaudio==0.2.14",
    "numpy==2.4.6",
    "torch==2.12.0",
    "torchaudio==2.11.0",
    "torchcodec==0.14.0",
    "transformers==5.10.2",
    "silero-vad==6.2.1",
    "soundfile==0.14.0",
    "scipy==1.17.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.3.5", "pytest-cov>=6.0.0", "ruff>=0.11.7"]

[tool.uv.sources]
tyapa-protocol = { path = "../../protocol", editable = true }
torch = { index = "pytorch-cpu" }
torchaudio = { index = "pytorch-cpu" }
torchcodec = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tyapa_hearing"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov --cov-report=term-missing"

[tool.coverage.run]
source = ["tyapa_hearing"]

[tool.coverage.report]
show_missing = true
fail_under = 80

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
