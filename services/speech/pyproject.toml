[project]
name = "tyapa-speech"
version = "0.1.0"
description = "Speech service: Kokoro TTS and the speaker"
requires-python = ">=3.11"
dependencies = [
    "tyapa-protocol",
    "pyaudio==0.2.14",
    "numpy==2.4.6",
    "torch==2.12.0",
    "torchaudio==2.11.0",
    "torchcodec==0.14.0",
    "kokoro==0.9.4",
    "en_core_web_sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
    "soundfile==0.14.0",
    "scipy==1.17.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.3.5", "pytest-cov>=6.0.0", "ruff>=0.11.7"]

[tool.uv.sources]
tyapa-protocol = { path = "../../protocol", editable = true }
torch = { index = "pytorch-cpu" }
torchaudio = { index = "pytorch-cpu" }
torchcodec = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.hatch.metadata]
allow-direct-references = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tyapa_speech"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov --cov-report=term-missing"

[tool.coverage.run]
source = ["tyapa_speech"]
omit = [
    "*/__main__.py",  # 3-line entry point
    "tyapa_speech/playback.py",  # hardware-only; tested manually on Pi
]

[tool.coverage.report]
show_missing = true
fail_under = 80
