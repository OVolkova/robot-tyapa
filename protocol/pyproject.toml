[project]
name = "tyapa-protocol"
version = "0.1.0"
description = "Shared message format, ports, and transport for the Tyapa services"
requires-python = ">=3.11"
dependencies = ["pyzmq>=24"]

[project.optional-dependencies]
dev = ["pytest>=8.3.5", "ruff>=0.11.7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tyapa_protocol"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
